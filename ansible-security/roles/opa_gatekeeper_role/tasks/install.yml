---
- name: Apply the Gatekeeper {{ gatekeeper_version }} manifest
  ansible.builtin.command: >
    kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/{{ gatekeeper_version }}/deploy/gatekeeper.yaml
  register: gatekeeper_apply
  changed_when: "'configured' in gatekeeper_apply.stdout or 'created' in gatekeeper_apply.stdout"

# The admission webhook must be up before any ConstraintTemplate is applied.
- name: Wait for the Gatekeeper deployments to be available
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment --all
    -n gatekeeper-system --timeout=180s
  changed_when: false

- name: Get Gatekeeper pods
  ansible.builtin.command: kubectl get pods -n gatekeeper-system
  register: get_pods_output
  changed_when: false

- name: Show Gatekeeper pods
  ansible.builtin.debug:
    msg: "{{ get_pods_output.stdout_lines }}"
