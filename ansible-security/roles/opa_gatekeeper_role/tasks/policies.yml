---
# Each policy: apply the template and the constraint, then prove it works by
# applying a manifest that must be rejected.
- name: Set variables for file paths
  ansible.builtin.set_fact:
    nodeport_template: "{{ role_path }}/files/policies/nodeport/k8sservicenodeportforbidden.yaml"
    nodeport_constraint: "{{ role_path }}/files/policies/nodeport/forbid-nodeport-services.yaml"
    nodeport_test_file: "{{ role_path }}/files/policies/nodeport/test-nodeport.yaml"
    latest_image_template: "{{ role_path }}/files/policies/images/k8sdenyimagelatest.yaml"
    latest_image_constraint: "{{ role_path }}/files/policies/images/no-latest-images.yaml"
    latest_image_test_file: "{{ role_path }}/files/policies/images/test-latest-image.yaml"
    no_privileged_template: "{{ role_path }}/files/policies/security/no-privileged-template.yaml"
    no_privileged_constraint: "{{ role_path }}/files/policies/security/no-privileged-constraint.yaml"
    no_privileged_test_file: "{{ role_path }}/files/policies/security/test-privileged-container.yaml"
    limits_template: "{{ role_path }}/files/policies/limits/k8srequiredresources.yaml"
    limits_constraint: "{{ role_path }}/files/policies/limits/require-limits.yaml"
    limits_test_file: "{{ role_path }}/files/policies/limits/test-no-limits.yaml"

# NodePort Policy
- name: Deploy NodePort ConstraintTemplate
  kubernetes.core.k8s:
    state: present
    src: "{{ nodeport_template }}"

- name: Deploy NodePort Constraint
  kubernetes.core.k8s:
    state: present
    src: "{{ nodeport_constraint }}"
  register: constraint_apply
  until: constraint_apply is succeeded
  retries: 10
  delay: 3

- name: Wait for the forbid-nodeport-services constraint
  ansible.builtin.include_tasks: wait_enforced.yml
  vars:
    constraint_kind: K8sServiceNodePortForbidden
    constraint_name: forbid-nodeport-services

- name: Test NodePort Constraint (Expected to fail)
  kubernetes.core.k8s:
    state: present
    src: "{{ nodeport_test_file }}"
  register: nodeport_test_result
  ignore_errors: true

- name: Verify NodePort Policy works (must be blocked)
  ansible.builtin.assert:
    that:
      - nodeport_test_result.failed
      - "'Forbidden' in nodeport_test_result.msg"
    success_msg: "✅ NodePort policy successfully blocked the service (as expected)."
    fail_msg: "❌ NodePort service was not blocked. Check Gatekeeper or policy syntax."

- name: Clean up NodePort test
  kubernetes.core.k8s:
    state: absent
    src: "{{ nodeport_test_file }}"
  ignore_errors: true

# Latest Image Policy
- name: Deploy Latest Image ConstraintTemplate
  kubernetes.core.k8s:
    state: present
    src: "{{ latest_image_template }}"

- name: Deploy Latest Image Constraint
  kubernetes.core.k8s:
    state: present
    src: "{{ latest_image_constraint }}"
  register: constraint_apply
  until: constraint_apply is succeeded
  retries: 10
  delay: 3

- name: Wait for the no-latest-images constraint
  ansible.builtin.include_tasks: wait_enforced.yml
  vars:
    constraint_kind: K8sDenyImageLatest
    constraint_name: no-latest-images

- name: Test Latest Image Constraint (Expected to fail)
  kubernetes.core.k8s:
    state: present
    src: "{{ latest_image_test_file }}"
  register: latest_image_test_result
  ignore_errors: true

- name: Verify Latest Image Policy works (must be blocked)
  ansible.builtin.assert:
    that:
      - latest_image_test_result.failed
      - "'latest' in latest_image_test_result.msg"
    success_msg: "✅ Latest image policy successfully blocked the deployment (as expected)."
    fail_msg: "❌ Latest image deployment was not blocked. Check Gatekeeper or policy syntax."

- name: Clean up Latest Image test
  kubernetes.core.k8s:
    state: absent
    src: "{{ latest_image_test_file }}"
  ignore_errors: true

# No Privileged Containers Policy
- name: Deploy No Privileged Containers ConstraintTemplate
  kubernetes.core.k8s:
    state: present
    src: "{{ no_privileged_template }}"

- name: Deploy No Privileged Containers Constraint
  kubernetes.core.k8s:
    state: present
    src: "{{ no_privileged_constraint }}"
  register: constraint_apply
  until: constraint_apply is succeeded
  retries: 10
  delay: 3

- name: Wait for the no-privileged-containers constraint
  ansible.builtin.include_tasks: wait_enforced.yml
  vars:
    constraint_kind: K8sContainerNoPrivileged
    constraint_name: no-privileged-containers

- name: Test No Privileged Containers Constraint (Expected to fail)
  kubernetes.core.k8s:
    state: present
    src: "{{ no_privileged_test_file }}"
  register: privileged_test_result
  ignore_errors: true

- name: Verify No Privileged Containers Policy works (must be blocked)
  ansible.builtin.assert:
    that:
      - privileged_test_result.failed
      - "'privileged' in privileged_test_result.msg"
    success_msg: "✅ No Privileged Containers policy successfully blocked the deployment (as expected)."
    fail_msg: "❌ Privileged container was not blocked. Check Gatekeeper or policy syntax."

- name: Clean up No Privileged Containers test
  kubernetes.core.k8s:
    state: absent
    src: "{{ no_privileged_test_file }}"
  ignore_errors: true

# Resource Limits Policy
- name: Deploy Resource Limits ConstraintTemplate
  kubernetes.core.k8s:
    state: present
    src: "{{ limits_template }}"

- name: Deploy Resource Limits Constraint
  kubernetes.core.k8s:
    state: present
    src: "{{ limits_constraint }}"
  register: constraint_apply
  until: constraint_apply is succeeded
  retries: 10
  delay: 3

- name: Wait for the require-limits constraint
  ansible.builtin.include_tasks: wait_enforced.yml
  vars:
    constraint_kind: K8sRequiredResources
    constraint_name: require-limits

- name: Clean up any existing test pod first
  kubernetes.core.k8s:
    kind: Pod
    name: nginx-no-limits
    namespace: prod
    state: absent
  ignore_errors: true

- name: Test Resource Limits Constraint (Expected to fail)
  kubernetes.core.k8s:
    state: present
    src: "{{ limits_test_file }}"
  register: limits_test_result
  ignore_errors: true

- name: Verify Resource Limits Policy works (must be blocked)
  ansible.builtin.assert:
    that:
      - limits_test_result.failed
      - "'must have CPU limits' in limits_test_result.msg or 'must have memory limits' in limits_test_result.msg"
    success_msg: "✅ Resource Limits policy successfully blocked the pod (as expected)."
    fail_msg: "❌ Pod without limits was not blocked. Check Gatekeeper or policy syntax."

- name: Clean up Resource Limits test
  kubernetes.core.k8s:
    state: absent
    src: "{{ limits_test_file }}"
  ignore_errors: true