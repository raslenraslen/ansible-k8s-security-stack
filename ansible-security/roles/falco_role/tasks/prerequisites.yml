---
- name: Check that kubectl is installed
  ansible.builtin.command: kubectl version --client
  register: kubectl_check
  ignore_errors: true
  changed_when: false
  failed_when: "'Client Version:' not in kubectl_check.stdout"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"

- name: Stop if kubectl is missing
  ansible.builtin.fail:
    msg: "kubectl is not installed or not in PATH. Install it and configure a kubeconfig."
  when: kubectl_check.failed

- name: Check that Helm is installed
  ansible.builtin.command: helm version
  register: helm_check
  ignore_errors: true
  changed_when: false
  failed_when: "'Version:' not in helm_check.stdout"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:/usr/bin"

- name: Stop if Helm is missing
  ansible.builtin.fail:
    msg: "Helm is not installed or not in PATH. Install it first."
  when: helm_check.failed