---
- name: Start the Falcosidekick UI port-forward (port 2802) in the background
  ansible.builtin.shell: |
    kubectl -n {{ falco_namespace }} port-forward --address 0.0.0.0 svc/falco-falcosidekick-ui 2802:2802 > /dev/null 2>&1 &
    echo $! > /tmp/falcosidekick_ui_pf_pid
  args:
    creates: /tmp/falcosidekick_ui_pf_pid
  changed_when: true
  register: pf_2802_output

- name: Wait for the port-forward to start
  ansible.builtin.pause:
    seconds: 5

- name: Show the Falcosidekick UI address
  ansible.builtin.debug:
    msg: "Falcosidekick UI: http://{{ falcosidekick_ui_ip }}:2802/dashboard/ (available while the kubectl port-forward process runs)"