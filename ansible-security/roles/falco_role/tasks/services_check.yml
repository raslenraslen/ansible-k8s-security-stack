---
- name: List the Falco services
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ falco_namespace }}"
    label_selectors:
      - app.kubernetes.io/instance=falco
  register: falco_services

- name: Show the Falco services
  ansible.builtin.debug:
    msg: "Service in {{ falco_namespace }}: {{ item.metadata.name }}"
  loop: "{{ falco_services.resources }}"
  when: falco_services.resources is defined and falco_services.resources | length > 0