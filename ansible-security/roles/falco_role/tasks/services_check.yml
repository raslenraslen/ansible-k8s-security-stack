---
- name: Obtenir les services Falco dans le namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ falco_namespace }}"
    label_selectors:
      - app.kubernetes.io/instance=falco
  register: falco_services

- name: Afficher la liste des services Falco
  debug:
    msg: "Services Falco dans le namespace {{ falco_namespace }} : {{ item.metadata.name }}"
  loop: "{{ falco_services.resources }}"
  when: falco_services.resources is defined and falco_services.resources | length > 0