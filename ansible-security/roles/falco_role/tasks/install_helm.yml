- name: Installer ou mettre à jour Falco avec Helm
  kubernetes.core.helm:
    name: falco
    chart_ref: falcosecurity/falco
    namespace: "{{ falco_namespace }}"
    create_namespace: false
    state: present
    kubeconfig: "{{ ansible_user_dir }}/.kube/config"
    release_values:
      # Configuration eBPF pour éviter les privilèges
      ebpf:
        enabled: true
      driver:
        enabled: false
      # Désactiver les privilèges
      privileged: false
      # Service account avec permissions limitées
      serviceAccount:
        create: true
        name: falco-sa
      # Configuration Falco spécifique
      falco:
        privileged: false
        ebpf:
          enabled: true
        # Rules personnalisées
        falco_rules_custom: |
          - rule: Simple Warning Test
            desc: This rule generates a 'Warning' alert for a specific command.
            condition: evt.type=execve and proc.cmdline contains "falco-test-warning"
            output: "Warning Test Alert: Command '%proc.cmdline' executed (Priority: %priority)"
            priority: Warning
            tags: [test, warning-test]
      falcosidekick:
        enabled: true
        webui:
          enabled: true
        config:
          discord:
            webhookurl: "{{ discord_webhook_url }}"
          customfields: "{{ falcosidekick_custom_fields }}"
  register: falco_helm_install
  become: no