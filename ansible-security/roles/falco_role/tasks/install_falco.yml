---
- name: Add the Falco Security Helm repository
  kubernetes.core.helm_repository:
    name: falcosecurity
    repo_url: https://falcosecurity.github.io/charts
    state: present

- name: Install or upgrade Falco with Falcosidekick
  kubernetes.core.helm:
    name: falco
    chart_ref: falcosecurity/falco
    namespace: "{{ falco_namespace }}"
    create_namespace: false
    state: present
    wait: true
    wait_timeout: "10m"
    release_values:
      falcosidekick:
        enabled: true
        webui:
          # Required by the port-forward in port_forward.yml
          enabled: true
          redis:
            # No PVC: works without a default StorageClass,
            # UI history is lost when the Redis pod restarts.
            storageEnabled: false
        config:
          discord:
            webhookurl: "{{ discord_webhook_url }}"
          customfields: "{{ falcosidekick_custom_fields }}"
  register: falco_helm_install

- name: Show the Falco release status
  ansible.builtin.debug:
    msg: "Falco release {{ falco_helm_install.status.name | default('falco') }}: {{ falco_helm_install.status.status | default('unknown') }}"
