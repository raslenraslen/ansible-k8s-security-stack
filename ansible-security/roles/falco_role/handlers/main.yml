---
- name: Tuer les processus port-forward (si lancés par ce playbook)
  ansible.builtin.shell: |
    if [ -f /tmp/falcosidekick_pf_pid ]; then
      kill $(cat /tmp/falcosidekick_pf_pid) || true
      rm /tmp/falcosidekick_pf_pid
    fi
    if [ -f /tmp/falcosidekick_ui_pf_pid ]; then
      kill $(cat /tmp/falcosidekick_ui_pf_pid) || true
      rm /tmp/falcosidekick_ui_pf_pid
    fi
  args:
    warn: false
  changed_when: false
  listen: "cleanup port-forwards"