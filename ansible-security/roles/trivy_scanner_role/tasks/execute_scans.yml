---
- name: Scan the container image {{ test_image }}
  ansible.builtin.command: >
    trivy image --format json --severity HIGH,CRITICAL
    --timeout {{ trivy_scan_timeout_minutes }}m
    --output {{ trivy_report_dir }}/image.json {{ test_image }}
  changed_when: false
  become: false
  tags: trivy_scan

- name: Scan application dependencies in {{ app_deps_target }}
  ansible.builtin.command: >
    trivy fs --format json --severity HIGH,CRITICAL
    --timeout {{ trivy_scan_timeout_minutes }}m
    --output {{ trivy_report_dir }}/dependencies.json {{ app_deps_target }}
  changed_when: false
  become: false
  when: app_deps_target | length > 0
  tags: trivy_scan

- name: Scan Kubernetes manifests in {{ k8s_config_target }}
  ansible.builtin.command: >
    trivy config --format json --severity HIGH,CRITICAL
    --timeout {{ trivy_scan_timeout_minutes }}m
    --output {{ trivy_report_dir }}/manifests.json {{ k8s_config_target }}
  changed_when: false
  become: false
  when: k8s_config_target | length > 0
  tags: trivy_scan

- name: Show where the reports are
  ansible.builtin.debug:
    msg: "Trivy JSON reports written to {{ trivy_report_dir }}"
  tags: trivy_scan
