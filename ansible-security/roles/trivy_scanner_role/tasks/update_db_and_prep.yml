---
- name: Update the Trivy vulnerability database
  ansible.builtin.command: trivy image --download-db-only
  changed_when: false
  become: false
  tags: trivy_scan

- name: Create the report directory
  ansible.builtin.file:
    path: "{{ trivy_report_dir }}"
    state: directory
    mode: "0755"
  become: false
  tags: trivy_scan
