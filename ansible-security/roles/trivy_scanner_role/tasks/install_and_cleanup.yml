---
- name: Install Trivy dependencies
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - software-properties-common
    state: present
    update_cache: true
  tags: trivy_install

- name: Download the Trivy repository key
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /tmp/trivy-key.gpg
    mode: "0644"
  tags: trivy_install

- name: Add the Trivy repository key
  ansible.builtin.apt_key:
    file: /tmp/trivy-key.gpg
    state: present
  tags: trivy_install

- name: Add the Trivy repository
  ansible.builtin.apt_repository:
    repo: "deb https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
    state: present
    filename: trivy
  tags: trivy_install

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: latest
    update_cache: true
  tags: trivy_install

- name: Check the Trivy version
  ansible.builtin.command: trivy --version
  register: trivy_version
  changed_when: false
  tags: trivy_install

- name: Show the Trivy version
  ansible.builtin.debug:
    msg: "{{ trivy_version.stdout_lines | first }}"
  tags: trivy_install

- name: Remove the downloaded key file
  ansible.builtin.file:
    path: /tmp/trivy-key.gpg
    state: absent
  tags: trivy_install
