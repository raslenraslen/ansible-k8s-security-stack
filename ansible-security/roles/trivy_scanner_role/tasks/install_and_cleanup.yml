# Fichier: roles/trivy_scanner_role/tasks/install_and_cleanup.yml

# --- Nettoyage Préalable (Sécurité/Idempotence) ---

- name: Supprimer les anciens fichiers de clés de Trivy (si existants)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/trivy.gpg
    - /etc/apt/trusted.gpg.d/trivy.gpg
    - /etc/apt/sources.list.d/trivy.list
  ignore_errors: yes
  tags: trivy_install

- name: Désinstaller Trivy si présent (pour assurer une installation propre)
  ansible.builtin.apt:
    name: trivy
    state: absent
    purge: yes
  ignore_errors: yes
  tags: trivy_install

- name: Vérifier et libérer les locks APT
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/apt/lists/lock
    - /var/lib/dpkg/lock
    - /var/lib/dpkg/lock-frontend
    - /var/cache/apt/archives/lock
  ignore_errors: yes
  tags: trivy_install

- name: Réparer les packages dpkg endommagés
  ansible.builtin.command: dpkg --configure -a
  ignore_errors: yes
  changed_when: false
  tags: trivy_install

# --- Installation des Dépendances ---

- name: Installer les dépendances
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - software-properties-common
    state: present
    update_cache: yes
  tags: trivy_install

# --- Installation de Trivy ---

- name: Télécharger la clé GPG de Trivy
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /tmp/trivy-key.gpg
  tags: trivy_install

- name: Ajouter la clé GPG de Trivy
  ansible.builtin.apt_key:
    file: /tmp/trivy-key.gpg
    state: present
  tags: trivy_install

- name: Ajouter le dépôt Trivy
  ansible.builtin.apt_repository:
    repo: "deb https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
    state: present
    filename: trivy
  tags: trivy_install

- name: Installer Trivy
  ansible.builtin.apt:
    name: trivy
    state: latest
    update_cache: yes
  tags: trivy_install

- name: Vérifier l'installation de Trivy
  ansible.builtin.command: trivy --version
  register: trivy_version
  changed_when: false
  tags: trivy_install

- name: Afficher la version de Trivy installée
  ansible.builtin.debug:
    msg: "Trivy installé avec succès : {{ trivy_version.stdout }}"
  tags: trivy_install

- name: Nettoyer les fichiers temporaires
  ansible.builtin.file:
    path: /tmp/trivy-key.gpg
    state: absent
  tags: trivy_install