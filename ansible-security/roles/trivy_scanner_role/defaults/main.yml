---
trivy_scan_timeout_minutes: 20

# Container image scanned for HIGH and CRITICAL vulnerabilities.
test_image: "nginx:1.20.0"

# Optional extra scans: leave empty to skip.
# app_deps_target: path to a dependency file or project folder (trivy fs)
# k8s_config_target: path to Kubernetes manifests (trivy config)
app_deps_target: ""
k8s_config_target: ""

# JSON reports are written here, on the machine running Ansible.
trivy_report_dir: "{{ lookup('env', 'HOME') }}/trivy-reports"
