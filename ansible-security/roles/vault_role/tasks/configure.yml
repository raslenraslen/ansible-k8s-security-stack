---
- name: Write the Vault configuration (vault.hcl)
  ansible.builtin.template:
    src: "vault.hcl.j2"
    dest: "{{ vault_config_path }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0640"

- name: Write the Vault systemd unit
  ansible.builtin.template:
    src: "vault.service.j2"
    dest: "/etc/systemd/system/vault.service"
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Stop Vault before wiping its data (vault_force_reinit only)
  ansible.builtin.systemd:
    name: vault
    state: stopped
  ignore_errors: true
  when: vault_force_reinit | bool

- name: Wipe all Vault data (vault_force_reinit only)
  ansible.builtin.file:
    path: "{{ vault_data_path }}"
    state: absent
  when: vault_force_reinit | bool

- name: Recreate the empty data directory (vault_force_reinit only)
  ansible.builtin.file:
    path: "{{ vault_data_path }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0700"
  when: vault_force_reinit | bool

- name: Start and enable Vault
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: yes

- name: Wait for Vault to listen on port 8200
  ansible.builtin.wait_for:
    port: 8200
    host: "{{ ansible_host }}"
    state: started
    timeout: 30
    delay: 3