---
- name: Install system packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - unzip
    - curl
    - vim
    - systemd
    - jq

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: yes

- name: Create the vault system user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    home: "{{ vault_config_path }}"
    shell: /bin/false
    system: yes

- name: Create the Vault config and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "{{ '0750' if item == vault_config_path or item == '/opt/vault' else '0700' }}"
    recurse: yes
  loop:
    - "{{ vault_config_path }}"
    - "/opt/vault"
    - "{{ vault_data_path }}"

- name: Download and install the Vault binary
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
    dest: "/usr/local/bin/"
    remote_src: yes
    creates: "/usr/local/bin/vault"
  register: vault_download_status

- name: Make the Vault binary executable
  ansible.builtin.file:
    path: "/usr/local/bin/vault"
    mode: "0755"

- name: Check the Vault version
  ansible.builtin.command: vault --version
  register: vault_version_check
  changed_when: false