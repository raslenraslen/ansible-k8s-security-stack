---
# "vault status" exit codes: 0 = unsealed, 1 = error, 2 = sealed.
# The JSON output is printed for both 0 and 2, so the state is read from it.

- name: Read Vault status before initialization
  ansible.builtin.command: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_address }}"
  args:
    chdir: "{{ vault_home_dir }}"
  register: pre_init_vault_status
  changed_when: false
  failed_when: pre_init_vault_status.rc not in [0, 2]

- name: Record whether Vault is initialized
  ansible.builtin.set_fact:
    vault_is_initialized: "{{ (pre_init_vault_status.stdout | from_json).initialized }}"

- name: Initialize Vault (one key share, lab setup)
  ansible.builtin.command: vault operator init -key-shares=1 -key-threshold=1 -format=json
  environment:
    VAULT_ADDR: "{{ vault_address }}"
  args:
    chdir: "{{ vault_home_dir }}"
  register: vault_init_output
  when: not vault_is_initialized | bool
  no_log: true

- name: Keep the unseal key and root token from this initialization
  ansible.builtin.set_fact:
    effective_unseal_key: "{{ (vault_init_output.stdout | from_json).unseal_keys_b64[0] }}"
    current_run_root_token: "{{ (vault_init_output.stdout | from_json).root_token }}"
  when: vault_init_output is not skipped
  no_log: true

- name: Save the init output on the machine running Ansible (mode 0600)
  ansible.builtin.copy:
    content: "{{ vault_init_output.stdout }}"
    dest: "{{ vault_init_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: vault_init_output is not skipped
  no_log: true

- name: Read Vault status before unsealing
  ansible.builtin.command: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_address }}"
  args:
    chdir: "{{ vault_home_dir }}"
  register: pre_unseal_vault_status
  changed_when: false
  failed_when: pre_unseal_vault_status.rc not in [0, 2]

- name: Unseal Vault
  ansible.builtin.command: vault operator unseal {{ effective_unseal_key }}
  environment:
    VAULT_ADDR: "{{ vault_address }}"
  args:
    chdir: "{{ vault_home_dir }}"
  when:
    - (pre_unseal_vault_status.stdout | from_json).sealed
    - effective_unseal_key | length > 0
  no_log: true

- name: Check that Vault is unsealed
  ansible.builtin.command: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_address }}"
  args:
    chdir: "{{ vault_home_dir }}"
  register: final_vault_status
  changed_when: false
  failed_when: final_vault_status.rc not in [0, 2]

- name: Show how to reach Vault
  ansible.builtin.debug:
    msg:
      - "UI: {{ vault_address }}/ui"
      - "Sealed: {{ (final_vault_status.stdout | from_json).sealed }}"
      - "{{ 'Unseal key and root token saved to ' + vault_init_file if current_run_root_token is defined else 'Vault was already initialized: use your existing unseal key and root token.' }}"
      - "{{ 'Vault is still sealed: run again with -e unseal_key_extra_var=<unseal key>' if (final_vault_status.stdout | from_json).sealed else '' }}"
