---
- name: 🛠️ PRÉPARATION DE L'ENVIRONNEMENT
  hosts: localhost
  become: yes
  gather_facts: true
  tags: prerequisites  
  
  roles:
    - prerequisites_role

- name: 🔐 DÉPLOIEMENT HASHICORP VAULT
  hosts: controllers
  become: yes
  gather_facts: true
  vars:
    vault_force_reinit: false
  environment:
    SHELL: /bin/bash
  tags: vault  
  
  roles:
    - vault_role

- name: 🛡️ DÉPLOIEMENT OPA GATEKEEPER
  hosts: localhost
  connection: local
  gather_facts: false
  tags: gatekeeper  
  
  roles:
    - opa_gatekeeper_role




- name: 🔍 DÉPLOIEMENT FALCO AVEC FALCOSIDEKICK
  hosts: localhost
  connection: local
  gather_facts: true
  tags: falco
  
  roles:
    - falco_role



- name: ⭐ AUDIT DE CONFIGURATION K8S AVEC POLARIS
  hosts: localhost
  connection: local
  gather_facts: false
  tags: polaris

  roles:
    - polaris_role