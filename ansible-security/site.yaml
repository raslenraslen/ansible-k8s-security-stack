---
# Run from the Kubernetes controller node: every play except Vault targets
# localhost and uses the kubeconfig of the user running ansible-playbook.

- name: Prepare the control node
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tags: prerequisites
  roles:
    - prerequisites_role

- name: Deploy HashiCorp Vault
  hosts: controllers
  become: true
  gather_facts: true
  environment:
    SHELL: /bin/bash
  tags: vault
  roles:
    - vault_role

- name: Deploy OPA Gatekeeper and its policies
  hosts: localhost
  connection: local
  gather_facts: false
  tags: gatekeeper
  roles:
    - opa_gatekeeper_role

- name: Deploy Falco with Falcosidekick
  hosts: localhost
  connection: local
  gather_facts: true
  tags: falco
  roles:
    - falco_role

- name: Deploy the Polaris configuration audit
  hosts: localhost
  connection: local
  gather_facts: false
  tags: polaris
  roles:
    - polaris_role

- name: Scan for vulnerabilities with Trivy
  hosts: localhost
  connection: local
  become: true
  gather_facts: true  # the apt repository line needs ansible_distribution_release
  tags: trivy
  roles:
    - trivy_scanner_role
